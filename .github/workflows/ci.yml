name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # Detect whether the change touches anything that warrants running the full
  # test/lint/docker pipeline. Docs-only changes (design notes, READMEs,
  # changelog fragments) skip the expensive jobs to save CI minutes.
  #
  # IMPORTANT: the eight "Test on Python 3.1x (suite)" jobs and
  # "Lint and type check" are *required* status checks (see the "Require CI
  # green" ruleset). A required check that never reports leaves the PR stuck
  # "Expected — waiting for status". So those jobs must always RUN and report
  # success — we gate their individual steps on ``needs.changes.outputs.code``
  # rather than skipping the whole job. The non-required docker job may be
  # skipped wholesale.
  #
  # Required checks are matched by job NAME, so renaming a test job (or
  # changing the matrix dimensions) requires updating the ruleset in the same
  # breath (issue #559 landed the python-version × suite split this way;
  # adding the ``slow`` suite widened it from six jobs to eight).
  #
  # The doc-only globs are deliberately narrow: ``src/clm/cli/info_topics/*.md``
  # and other markdown shipped under ``src/`` are covered by tests, so a blanket
  # ``**/*.md`` would wrongly skip CI for them. Only ``docs/``, ``changelog.d/``
  # and top-level ``*.md`` count as docs-only.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: false
      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # ``code`` is true when at least one changed file is NOT docs-only.
          #
          # ``predicate-quantifier: every`` is essential: by default a file
          # matches a filter when it matches ANY listed pattern, and every file
          # matches at least one of these negations (nothing is simultaneously
          # under docs/, under changelog.d/ AND a top-level *.md), which made
          # ``code`` always true and ran the full pipeline for docs-only
          # changes. With ``every``, a file counts as code only when it matches
          # ALL negations, i.e. is none of the docs-only locations.
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!changelog.d/**'
              - '!*.md'

  test:
    # The suites run as parallel jobs instead of sequential steps (issue #559):
    # per-job setup is ~40 s with warm caches, so the split costs ~3 machine-
    # minutes and cuts the test wall clock from ~7 to ~4 minutes.
    #
    # ``slow`` joined the matrix rather than staying nightly-only (finding T2 /
    # decision D12, revisited): the tier is 37 tests / ~78 s at -n 4, so as a
    # PARALLEL job it costs machine-minutes but no wall clock — the unit job is
    # ~4.5 min and the docker job ~6.5 min, both longer. It was never excluded
    # for cost. The other three suites keep ``not slow``, so nothing runs twice.
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.suite }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        suite: [unit, integration, e2e, slow]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        lfs: false

    # The non-docker test suite needs only the small fixture/template images,
    # not the docker/ build inputs. Pulling only what we need (and excluding
    # docker/**) keeps LFS bandwidth down and guards against any large binary
    # ever re-landing under docker/ silently inflating every CI run.
    - name: Pull LFS test fixtures (excluding docker build inputs)
      if: needs.changes.outputs.code == 'true'
      run: git lfs pull --exclude="docker/**"

    - name: Set up Python ${{ matrix.python-version }}
      if: needs.changes.outputs.code == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Java for PlantUML
      if: needs.changes.outputs.code == 'true'
      uses: actions/setup-java@v5.6.0
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      if: needs.changes.outputs.code == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libxcb-dri3-0

    - name: Install PlantUML
      if: needs.changes.outputs.code == 'true'
      run: |
        wget -O plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2024.6/plantuml-1.2024.6.jar
        echo "PLANTUML_JAR=$PWD/plantuml.jar" >> $GITHUB_ENV

    - name: Install DrawIO
      if: needs.changes.outputs.code == 'true'
      run: |
        # Download DrawIO from GitHub releases
        wget -O drawio.deb https://github.com/jgraph/drawio-desktop/releases/download/v24.7.17/drawio-amd64-24.7.17.deb
        sudo dpkg -i drawio.deb || sudo apt-get install -f -y
        echo "DRAWIO_EXECUTABLE=/opt/drawio/drawio" >> $GITHUB_ENV

    - name: Install uv
      if: needs.changes.outputs.code == 'true'
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Install dependencies
      if: needs.changes.outputs.code == 'true'
      run: |
        # Install the EXACT versions from uv.lock so CI matches a developer's
        # local `uv sync` (issue #516 follow-up: the old fresh `uv pip install`
        # resolved a different Click than the lock, hiding environment drift).
        # `--locked` fails fast when the lockfile is stale — safe now that
        # pyproject pins exclude-newer as a full canonical timestamp, so uv's
        # bare-date normalization can no longer drift across versions
        # (issue #524). Same extra set as before via explicit `--extra` +
        # `--no-default-groups` (the `dev` extra carries the pytest stack),
        # so the only change is the version source.
        # `replay` keeps the HTTP-replay cassette tests running instead of
        # importorskip-skipping. ML/jupyterlite stay out by design.
        uv sync --locked --python ${{ matrix.python-version }} --no-default-groups \
          --extra all-workers --extra summarize --extra recordings --extra slides \
          --extra mcp --extra replay --extra dev --extra tui --extra web

    - name: Start Xvfb
      if: needs.changes.outputs.code == 'true'
      run: |
        Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset &
        echo "DISPLAY=:99" >> $GITHUB_ENV
        sleep 2

    - name: Verify external tools
      if: needs.changes.outputs.code == 'true'
      run: |
        echo "Checking Java..."
        java -version
        echo "Checking PlantUML..."
        java -jar $PLANTUML_JAR -version
        echo "Checking DrawIO..."
        ls -la $DRAWIO_EXECUTABLE
        echo "Checking DISPLAY..."
        echo $DISPLAY
        echo "Checking Xvfb..."
        pgrep -x Xvfb

    - name: Configure git identity for tests
      if: needs.changes.outputs.code == 'true'
      run: |
        git config --global user.email "ci@github.actions"
        git config --global user.name "GitHub Actions CI"

    # One suite per job; each 3.12 job uploads its own coverage report and
    # Codecov merges the uploads per commit (no --cov-append stitching).
    - name: Run unit tests
      if: needs.changes.outputs.code == 'true' && matrix.suite == 'unit'
      run: |
        uv run --no-sync pytest -v -m "not slow and not integration and not e2e and not docker" --timeout=120 --cov=src/clm --cov-report=xml --cov-report=term

    - name: Run integration tests
      if: needs.changes.outputs.code == 'true' && matrix.suite == 'integration'
      run: |
        uv run --no-sync pytest -v -m "integration and not docker and not slow" --timeout=240 --log-cli-level=INFO --cov=src/clm --cov-report=xml --cov-report=term
      env:
        CLM_ENABLE_TEST_LOGGING: "1"
        CLM_LOG_LEVEL: INFO

    - name: Run E2E tests
      if: needs.changes.outputs.code == 'true' && matrix.suite == 'e2e'
      run: |
        uv run --no-sync pytest -v -m "e2e and not docker and not slow" --timeout=600 --log-cli-level=INFO --cov=src/clm --cov-report=xml --cov-report=term
      env:
        CLM_E2E_TIMEOUT: 600  # 10 minutes timeout for E2E tests (allows multi-build tests)
        CLM_ENABLE_TEST_LOGGING: "1"
        CLM_LOG_LEVEL: INFO

    # The tier the other three exclude. Contains the only proof that a cached
    # notebook replays byte-identically to a direct execution
    # (test_cache_equivalence.py), the worker-reuse-across-builds e2e tests
    # covering the PR #595 bug, all 18 real-subprocess CLI tests, and the
    # high-concurrency Direct-worker tests. Timeout matches the nightly's
    # former value; the real-subprocess tests are the long poles.
    - name: Run slow tests
      if: needs.changes.outputs.code == 'true' && matrix.suite == 'slow'
      run: |
        uv run --no-sync pytest -v -m "slow and not docker" --timeout=900 --log-cli-level=INFO --cov=src/clm --cov-report=xml --cov-report=term
      env:
        CLM_E2E_TIMEOUT: 900
        CLM_ENABLE_TEST_LOGGING: "1"
        CLM_LOG_LEVEL: INFO

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      continue-on-error: true
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
      if: needs.changes.outputs.code == 'true' && matrix.python-version == '3.12'

  lint:
    name: Lint and type check
    needs: changes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      if: needs.changes.outputs.code == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install uv
      if: needs.changes.outputs.code == 'true'
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Install dependencies
      if: needs.changes.outputs.code == 'true'
      run: |
        # From the lockfile (see the test job; `--locked` for the same reason),
        # same extra set as before so lint/type-check sees the exact versions
        # developers do. The `dev` extra carries ruff + mypy; the worker extras
        # give mypy the imports to resolve.
        uv sync --locked --python 3.12 --no-default-groups \
          --extra dev --extra tui --extra web --extra notebook --extra summarize \
          --extra recordings --extra slides --extra mcp

    - name: Run ruff check
      if: needs.changes.outputs.code == 'true'
      run: |
        uv run --no-sync ruff check src/ tests/

    - name: Run ruff format check
      if: needs.changes.outputs.code == 'true'
      run: |
        uv run --no-sync ruff format --check src/ tests/

    - name: Run mypy
      if: needs.changes.outputs.code == 'true'
      run: |
        uv run --no-sync mypy src/clm

  docker-test:
    name: Docker Integration Tests
    needs: changes
    # Not a required status check, so it is safe to skip the whole job for
    # docs-only changes.
    #
    # It is not required because its image builds reach four external hosts
    # (Docker Hub, dot.net, astral.sh, the pinned GitHub release assets) and
    # flaked ~12% of recent runs on registry timeouts and partial transfers —
    # failures unrelated to the change under test. The layer cache below plus
    # the retry loops in docker/notebook/Dockerfile exist to drive that toward
    # zero, so this job can eventually join the ruleset. Until it does,
    # remember: a green PR proves nothing about this job, and
    # ``report-master-failure`` is what surfaces a breakage that slips through.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # The type=gha buildx cache backend writes through the Actions cache API.
      actions: write

    steps:
    # The notebook/plantuml/drawio build inputs (deno, ijava, drawio .deb) are
    # now fetched + SHA-256-verified inside the Dockerfiles, so the only LFS
    # object the image builds need is the small drawio font.
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Built through build-push-action rather than plain `docker build` purely
    # to get `cache-from`/`cache-to`. On a cache hit BuildKit replays the
    # layers instead of re-running them, so the external fetches inside the
    # Dockerfiles (dotnet, uv, deno, ijava, the drawio .deb, apt, pip) do not
    # happen at all — which is the point: those fetches are the flake.
    #
    # `load: true` puts the image into the local daemon, which the tests need;
    # without it buildx keeps the result in its own cache and
    # `docker.images.get()` finds nothing.
    #
    # `mode=min` on purpose. These Dockerfiles are linear multi-stage chains
    # (base → common → packages-<variant> → final), so the final image's layer
    # set already covers every stage on the build path; `mode=max` would add
    # the off-path stages (notably the CUDA-based `base-full-amd64`, which CI
    # never builds) and could crowd the repository's 10 GB Actions-cache budget,
    # evicting the uv caches other jobs depend on. Scoped per image so the
    # three builds cannot evict each other.
    - name: Build notebook-processor:lite-test Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/notebook/Dockerfile
        build-args: |
          VARIANT=lite
          DOCKER_PATH=docker/notebook
        tags: clm-notebook-processor:lite-test
        load: true
        cache-from: type=gha,scope=notebook-lite
        cache-to: type=gha,mode=min,scope=notebook-lite

    - name: Build plantuml-converter:test Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/plantuml/Dockerfile
        build-args: |
          DOCKER_PATH=docker/plantuml
        tags: clm-plantuml-converter:test
        load: true
        cache-from: type=gha,scope=plantuml
        cache-to: type=gha,mode=min,scope=plantuml

    - name: Build drawio-converter:test Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/drawio/Dockerfile
        build-args: |
          DOCKER_PATH=docker/drawio
        tags: clm-drawio-converter:test
        load: true
        cache-from: type=gha,scope=drawio
        cache-to: type=gha,mode=min,scope=drawio

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        # From the lockfile (see the test job; `--locked` for the same reason),
        # same extra set as before.
        uv sync --locked --python 3.12 --no-default-groups \
          --extra all-workers --extra recordings --extra dev --extra tui --extra web

    - name: Run Docker integration tests
      run: |
        uv run --no-sync pytest -v -n0 -m "docker" --timeout=600 --log-cli-level=INFO
      env:
        CLM_E2E_TIMEOUT: 600
        CLM_ENABLE_TEST_LOGGING: "1"
        CLM_LOG_LEVEL: INFO

  # ------------------------------------------------------------------
  # A red master must be impossible to miss.
  #
  # "Docker Integration Tests" is deliberately NOT a required status check
  # (its image builds fetch from four external hosts and flake ~12% of the
  # time on registry timeouts and partial transfers). That is a reasonable
  # trade, but it has a sharp edge: a PR can be green and still break master,
  # which is exactly what happened when PR #667 un-skipped a module containing
  # docker-marked tests. Nothing surfaced it until someone happened to look.
  #
  # This job closes that gap for EVERY job in the workflow, not just docker:
  # any failure on a push to the default branch files (or comments on) an
  # issue within minutes. It never runs for pull requests — a red PR is
  # already visible to the person who opened it.
  # ------------------------------------------------------------------
  report-master-failure:
    name: Report master failure
    needs: [changes, test, lint, docker-test]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: false

      - uses: ./.github/actions/report-failure
        with:
          label: master-red
          title: CI is failing on master
          label-description: A post-merge CI run on master failed
          context: >-
            At least one job failed on `master` after a merge. Note that the
            **Docker Integration Tests** job is not a required status check, so
            a failure there can reach `master` through a fully green PR — check
            it explicitly before assuming the required suites are at fault.
