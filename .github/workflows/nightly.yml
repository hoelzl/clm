name: Nightly full suite

# A FLAKE AND ROT DETECTOR, not a coverage backstop.
#
# This started life (finding T2 / decision D12) as the home for the ``slow``
# marker, which ci.yml excluded from every step — so ~37 tests, including the
# only proof that a cached notebook replays byte-identically to a direct
# execution, ran nowhere at all. That tier now runs on every PR as a fourth
# parallel matrix suite, because it costs machine-minutes but no wall clock.
#
# What survives here is the job PR CI structurally *cannot* do: run the
# **whole** suite — docker included — against **unchanged** master, repeatedly.
# A PR run tells you "this change is fine". Thirty runs of identical code tell
# you "this test is 3% flaky", which is how a contention regression like issue
# #163 surfaces before it wastes someone's afternoon.
#
# (Dependency drift, the other usual nightly justification, barely applies
# here: CI installs from uv.lock with UV_EXCLUDE_NEWER pinned, so nothing moves
# underneath us.)
#
# WHERE FAILURES SURFACE: the ``report-failure`` job files a GitHub issue
# labelled ``nightly-failure``, or comments on the existing open one. That is
# deliberate and load-bearing — a nightly job nobody reads is worse than no
# nightly job, because it manufactures the feeling of coverage. Do not remove
# it without replacing it with a route the maintainer actually reads.

on:
  schedule:
    # 03:17 UTC daily. Off the hour on purpose: GitHub's scheduler is heavily
    # oversubscribed at :00 and delays runs by tens of minutes.
    - cron: '17 3 * * *'
  workflow_dispatch:

# Never run two nightlies at once (a manual dispatch during a scheduled run).
concurrency:
  group: nightly-full
  cancel-in-progress: false

jobs:
  full:
    # Everything except the docker tier, in one process rather than the four
    # parallel suites PR CI uses: a single run is a truer flake measurement,
    # and wall clock does not matter at 03:17.
    name: Full suite, no docker (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One interpreter is enough for a daily flake sweep; the PR matrix
        # already covers 3.12 + 3.13. Widen only if a flake ever turns out to
        # be version-specific.
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        lfs: false

    # Same exclusion as the PR test job: the non-docker suites need only the
    # small fixture/template images, not the docker/ build inputs.
    - name: Pull LFS test fixtures (excluding docker build inputs)
      run: git lfs pull --exclude="docker/**"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Java for PlantUML
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libxcb-dri3-0

    - name: Install PlantUML
      run: |
        wget -O plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2024.6/plantuml-1.2024.6.jar
        echo "PLANTUML_JAR=$PWD/plantuml.jar" >> $GITHUB_ENV

    - name: Install DrawIO
      run: |
        wget -O drawio.deb https://github.com/jgraph/drawio-desktop/releases/download/v24.7.17/drawio-amd64-24.7.17.deb
        sudo dpkg -i drawio.deb || sudo apt-get install -f -y
        echo "DRAWIO_EXECUTABLE=/opt/drawio/drawio" >> $GITHUB_ENV

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        # Same lockfile-pinned install as the PR test job; see ci.yml for why
        # `--locked` and this exact extra set.
        uv sync --locked --python ${{ matrix.python-version }} --no-default-groups \
          --extra all-workers --extra summarize --extra recordings --extra slides \
          --extra mcp --extra replay --extra dev --extra tui --extra web

    - name: Start Xvfb
      run: |
        Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset &
        echo "DISPLAY=:99" >> $GITHUB_ENV
        sleep 2

    - name: Configure git identity for tests
      run: |
        git config --global user.email "ci@github.actions"
        git config --global user.name "GitHub Actions CI"

    - name: Run full suite (no docker)
      run: |
        uv run --no-sync pytest -v -m "not docker" --timeout=900 --log-cli-level=INFO
      env:
        CLM_E2E_TIMEOUT: 900
        CLM_ENABLE_TEST_LOGGING: "1"
        CLM_LOG_LEVEL: INFO

  docker:
    # The tier that is NOT a required check on PRs, so a regression in it can
    # reach master (it did — PR #667 was green and broke this job). Running it
    # nightly means a red docker tier surfaces as an issue within a day even if
    # nobody looks at the merge commit's CI.
    name: Docker tier
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # ``cache-from`` but NOT ``cache-to``: this job reads the layer cache the
    # PR workflow populates, and does not write to it.
    #
    # Reading matters because a nightly that rebuilds cold every night would
    # keep hitting the ~12% external-fetch flake and file a spurious
    # ``nightly-failure`` issue roughly weekly — which poisons the alert
    # channel and turns this into the nightly-nobody-reads it was designed not
    # to be. This job exists to detect flaky *tests*, not flaky image builds;
    # the PR workflow already builds these images on every code change.
    #
    # Not writing matters because two workflows writing the same scopes would
    # thrash the repository's Actions-cache budget.
    - name: Build notebook-processor:lite-test Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/notebook/Dockerfile
        build-args: |
          VARIANT=lite
          DOCKER_PATH=docker/notebook
        tags: clm-notebook-processor:lite-test
        load: true
        cache-from: type=gha,scope=notebook-lite

    - name: Build plantuml-converter:test Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/plantuml/Dockerfile
        build-args: |
          DOCKER_PATH=docker/plantuml
        tags: clm-plantuml-converter:test
        load: true
        cache-from: type=gha,scope=plantuml

    - name: Build drawio-converter:test Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/drawio/Dockerfile
        build-args: |
          DOCKER_PATH=docker/drawio
        tags: clm-drawio-converter:test
        load: true
        cache-from: type=gha,scope=drawio

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --locked --python 3.12 --no-default-groups \
          --extra all-workers --extra recordings --extra dev --extra tui --extra web

    - name: Run Docker integration tests
      run: |
        uv run --no-sync pytest -v -n0 -m "docker" --timeout=600 --log-cli-level=INFO
      env:
        CLM_E2E_TIMEOUT: 600
        CLM_ENABLE_TEST_LOGGING: "1"
        CLM_LOG_LEVEL: INFO

  # Keeps ONE issue up to date with the Docker job's recent outcomes on master,
  # so the decision to promote it to a required status check does not depend on
  # anyone remembering to look. Independent of whether tonight's suite passed —
  # it measures the *other* workflow — hence `if: always()`.
  docker-promotion-tracker:
    name: Track Docker job stability
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      issues: write
      # `gh run list` / `gh run view` read the CI workflow's history.
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update the promotion-readiness issue
        run: python scripts/docker_job_stability.py --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

  report-failure:
    name: Report failure
    needs: [full, docker]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: false

      - uses: ./.github/actions/report-failure
        with:
          label: nightly-failure
          title: Nightly full-suite run is failing
          label-description: A scheduled nightly run failed
          context: >-
            This runs the whole suite, docker tier included, against unchanged
            master. A failure here with no corresponding change on master means
            a **flaky test**, not a regression — check whether the same test
            failed on earlier nights before hunting for a cause in the code.
